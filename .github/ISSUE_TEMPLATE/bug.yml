name: バグ報告
description: 不具合・予期しない動作を報告する
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        バグの報告をありがとうございます。再現手順を含めて詳しく記入してください。

  - type: textarea
    id: summary
    attributes:
      label: バグの概要
      description: どんな問題が起きているかを一言で説明してください
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. 〇〇画面を開く
        2. 〇〇ボタンをクリックする
        3. エラーが発生する
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      description: 本来どう動くべきかを記述してください
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際に何が起きているかを記述してください
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 環境
      placeholder: |
        - OS: Windows 11
        - ブラウザ: Chrome 124
        - バックエンド: Spring Boot 3.4.1
    validations:
      required: false
